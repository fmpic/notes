name: Deploy Quartz Notes to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notes
        uses: actions/checkout@v4
        with:
          path: my-notes
          fetch-depth: 0

      - name: Checkout Quartz Engine
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          path: quartz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Quartz
        run: |
          npm i
          npx quartz plugin install --from-config

      - name: Prepare Content and Config
        run: |
          rm -rf quartz/content/*
          rsync -av --exclude='quartz.config.yaml' --exclude='.github/' --exclude='.git/' my-notes/ quartz/content/
          cp my-notes/quartz.config.yaml quartz/quartz.config.yaml

      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quartz/public
          publish_branch: gh-pages
          force_orphan: true
